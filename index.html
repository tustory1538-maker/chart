<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>내 차트</title>
<meta name="theme-color" content="#131722">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="내 차트">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#131722; --panel:#1e222d; --panel2:#2a2e39; --line:#363a45; --text:#d1d4dc; --muted:#787b86;
    --accent:#2962ff; --up:#26a69a; --down:#ef5350;
  }
  body.light{ --bg:#ffffff; --panel:#f8f9fd; --panel2:#eef0f5; --line:#e0e3eb; --text:#131722; --muted:#787b86; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
  button,select,input{font:inherit;color:inherit}
  button{background:none;border:0;cursor:pointer;border-radius:4px;padding:5px 8px}
  button:hover{background:var(--panel2)}
  button.on{color:var(--accent);background:var(--panel2)}
  select,input[type=number],input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
  #app{display:grid;grid-template-rows:42px 1fr;grid-template-columns:44px 1fr auto;position:fixed;inset:0}
  #top{grid-column:1/4;display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;white-space:nowrap}
  #top > *{flex:none}
  #top .sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
  #symBtn{font-weight:700;background:var(--panel2);border:1px solid var(--line);padding:4px 10px}
  #symBtn small{font-weight:400;color:var(--muted);margin-left:4px}
  #price{font-weight:600;margin-left:6px;min-width:90px}
  #tfs button{padding:5px 6px}
  #btnLayout{max-width:180px;overflow:hidden;text-overflow:ellipsis}
  #left{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:2px;overflow-y:auto}
  #left button.tb{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;position:relative}
  #left .tg{position:relative;display:flex;align-items:center}
  #left .more{position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:10px;height:22px;padding:0;font-size:11px;color:var(--muted);border-radius:3px;opacity:.6}
  #left .tg:hover .more{opacity:1}
  .menu .fi svg,.menu .fi{width:20px;height:20px;display:inline-flex}
  .menu .fi svg{stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .menu .row.fly{justify-content:flex-start;min-width:240px}
  #btnType{padding:4px 6px;display:inline-flex}
  #btnType svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
  #left svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  #left .sep{width:26px;height:1px;background:var(--line);margin:4px 0}
  #btnMagnet .lv{position:absolute;right:2px;bottom:1px;font-size:9px;font-weight:700}
  #center{position:relative;min-width:0}
  #grid{position:absolute;inset:0;display:grid;gap:2px;background:var(--line)}
  .cell{position:relative;min-width:0;min-height:0;background:var(--bg);outline:1px solid transparent;outline-offset:-1px}
  #grid.multi .cell.act{outline-color:var(--accent)}
  .cell .cv{position:absolute;inset:0}
  .clabel{display:none;position:absolute;left:8px;top:6px;z-index:5;pointer-events:none;font-weight:700;font-size:12px;background:var(--panel);opacity:.85;padding:1px 6px;border-radius:4px}
  #grid.many .clabel{display:block}
  #grid[data-g="1"]{grid-template:1fr/1fr}
  #grid[data-g="2h"]{grid-template:1fr/1fr 1fr}
  #grid[data-g="2v"]{grid-template:1fr 1fr/1fr}
  #grid[data-g="3"]{grid-template:1fr 1fr/2fr 1fr} #grid[data-g="3"] .cell:first-child{grid-row:1/3}
  #grid[data-g="4"]{grid-template:1fr 1fr/1fr 1fr}
  #grid[data-g="6"]{grid-template:1fr 1fr/1fr 1fr 1fr}
  #grid[data-g="8"]{grid-template:1fr 1fr/1fr 1fr 1fr 1fr}
  #grid[data-g="9"]{grid-template:1fr 1fr 1fr/1fr 1fr 1fr}
  .gridpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 8px}
  .gridpick button{border:1px solid var(--line);padding:6px 0;font-size:12px}
  .gridpick button.on{border-color:var(--accent)}
  #indEdit .lvrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  #indEdit .lvrow input[type=number]{width:70px}
  #right{width:300px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
  #right.hide{display:none}
  #right h3{margin:0;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
  #wl{overflow-y:auto;flex:1}
  .wl-row,.wl-head{display:grid;grid-template-columns:1fr 78px 62px 58px 14px;gap:4px;align-items:center;padding:7px 8px 7px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  .wl-head{cursor:default;font-size:11px;color:var(--muted);padding-top:5px;padding-bottom:5px} .wl-head span{text-align:right} .wl-head span:first-child{text-align:left}
  .wl-row .a{text-align:right;font-size:12px}
  .wl-row .p,.wl-row .a,.wl-row .c{color:var(--text)}
  .wl-row .fl-up{animation:flu .8s ease-out} .wl-row .fl-dn{animation:fld .8s ease-out}
  @keyframes flu{0%,45%{color:var(--up)}100%{color:var(--text)}}
  @keyframes fld{0%,45%{color:var(--down)}100%{color:var(--text)}}
  .wl-row:hover{background:var(--panel2)} .wl-row.cur{background:var(--panel2)}
  .wl-row .s{font-weight:600} .m{font-size:10px;color:var(--muted);margin-left:3px} .wl-row .sn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wl-row .p{text-align:right;font-variant-numeric:tabular-nums} .wl-row .c{text-align:right;font-variant-numeric:tabular-nums}
  .wl-row .x{color:var(--muted);visibility:hidden;padding:0} .wl-row:hover .x{visibility:visible}
  .upc{color:var(--up)} .downc{color:var(--down)}
  .menu{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.35);padding:6px;min-width:220px;display:none;max-height:80vh;overflow-y:auto}
  .menu.show{display:block}
  .menu .t{color:var(--muted);font-size:11px;padding:6px 8px 2px}
  .menu .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 8px;border-radius:4px;cursor:pointer}
  .menu .row:hover{background:var(--panel2)}
  .menu .row.cur{color:var(--accent);font-weight:600}
  .menu .hr{height:1px;background:var(--line);margin:4px 0}
  .menu label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 8px}
  input[type=color]{width:36px;height:24px;border:1px solid var(--line);background:none;padding:0;cursor:pointer}
  /* 종목 검색 */
  #symPanel{width:min(460px,96vw);padding:0}
  #symPanel .hd{padding:8px;display:flex;gap:6px;border-bottom:1px solid var(--line)}
  #symPanel .hd input{flex:1;font-size:14px;padding:6px 8px;text-transform:uppercase}
  #symPanel .tabs button.on{background:var(--accent);color:#fff}
  #symPanel .tabs{display:flex;gap:4px;flex:none;align-items:center}
  #symPanel .tabs button{white-space:nowrap}
  body.mobile #symPanel{max-width:none}
  body.mobile #symPanel .hd{flex-wrap:wrap;gap:6px}
  body.mobile #symPanel .hd input{flex:1 1 100%;height:40px;padding:6px 10px;font-size:15px}
  body.mobile #symPanel .tabs{flex:1 1 100%}
  body.mobile #symPanel .tabs button{flex:1;padding:7px 0;border:1px solid var(--line)}
  #symList{max-height:min(60vh,520px);overflow-y:auto}
  .sym-row{display:grid;grid-template-columns:22px 1fr 90px 64px 64px;gap:6px;align-items:center;padding:6px 10px;cursor:pointer;font-variant-numeric:tabular-nums}
  .sym-row:hover,.sym-row.hl{background:var(--panel2)}
  .sym-row .st{color:var(--muted);text-align:center} .sym-row .st.on{color:#f7c948}
  .sym-row .n{font-weight:600} .sym-row .r{text-align:right}
  .sym-head{display:grid;grid-template-columns:22px 1fr 90px 64px 64px;gap:6px;padding:4px 10px;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line)}
  .sym-head .r{text-align:right}
  /* 작도 편집 바 */
  #drawBar{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:max-content;z-index:25;display:none;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 12px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 6px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
  #drawBar.show{display:flex}
  #drawBar .sw{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent}
  #drawBar .sw.on{border-color:var(--text)}
  #drawBar .vs{width:1px;height:20px;background:var(--line);margin:0 2px}
  #dbSw{display:inline-flex;gap:4px}
  #dbName{font-weight:600;font-size:12px;padding:0 4px;color:var(--muted)}
  #drawBar.nostyle .stl{display:none!important}
  #dbFillW{display:flex;align-items:center;gap:4px;color:var(--muted)}
  #dbFill{width:70px}
  #dbDel{color:var(--down)}
  #dbDel{color:var(--down)}
  /* 리플레이 */
  #replayBar{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:20;display:none;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;box-shadow:0 4px 16px rgba(0,0,0,.3);white-space:nowrap}
  #replayBar.show{display:flex}
  #rpTime{font-variant-numeric:tabular-nums;color:var(--muted);margin:0 6px}
  #hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:26;display:none;align-items:center;gap:6px;background:var(--accent);color:#fff;border-radius:6px;padding:6px 10px;white-space:nowrap}
  #hint.show{display:flex}
  #hint input{background:rgba(255,255,255,.15);border:0;border-radius:4px;color:#fff;padding:3px 6px}
  #hint button{color:#fff;background:rgba(255,255,255,.15)}
  #rpBadge{display:none;background:#ff9800;color:#000;font-weight:700;border-radius:4px;padding:2px 6px;font-size:11px}
  /* 지표 설정 창 */
  .modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center}
  .modal.show{display:flex}
  #setBox{width:min(620px,96vw);height:min(560px,92vh);background:var(--panel);border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:150px 1fr;grid-template-rows:44px 1fr 48px;overflow:hidden}
  #setBox .hd{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line);font-weight:700}
  #setTabs{border-right:1px solid var(--line);padding:6px;overflow-y:auto}
  #setTabs .it{padding:8px 10px;border-radius:4px;cursor:pointer} #setTabs .it:hover{background:var(--panel2)} #setTabs .it.sel{background:var(--panel2);color:var(--accent);font-weight:600}
  #setBody{overflow-y:auto;padding:10px 16px}
  #setBody .sec{color:var(--muted);font-size:11px;margin:14px 0 4px;text-transform:uppercase}
  #setBody .srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
  #setBody .srow.btns{justify-content:flex-start;flex-wrap:wrap;border:0}
  #setBody .srow.btns button{border:1px solid var(--line)}
  #setBody .note{color:var(--muted);font-size:12px;margin:6px 0}
  #setBody button[disabled]{opacity:.4;cursor:default}
  #setBox .ft{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-top:1px solid var(--line)}
  #indBox{width:min(640px,96vw);height:min(520px,90vh);background:var(--panel);border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:190px 1fr;grid-template-rows:44px 1fr;overflow:hidden}
  #indBox .hd{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line);font-weight:700}
  #indList{border-right:1px solid var(--line);overflow-y:auto;padding:6px}
  #indList .t{color:var(--muted);font-size:11px;padding:6px 6px 2px}
  #indList .it{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:4px;cursor:pointer}
  #indList .it:hover{background:var(--panel2)} #indList .it.sel{background:var(--panel2);color:var(--accent)}
  #indList .it input{margin:0}
  #indEdit{overflow-y:auto;padding:12px 16px}
  #indEdit h4{margin:0 0 10px;font-size:14px}
  #indEdit .sec{color:var(--muted);font-size:11px;margin:14px 0 6px}
  #indEdit .prm{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  #indEdit .prm input{width:64px}
  #indEdit .ln{display:grid;grid-template-columns:110px 40px 90px;gap:8px;align-items:center;margin-bottom:6px}
  #indEdit .empty{color:var(--muted);margin-top:40px;text-align:center}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:6px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
  #toast.show{opacity:1}
  #app{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-user-select:none;user-select:none}
  html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  input,select{-webkit-user-select:auto;user-select:auto}
  @media (pointer:coarse){ #left .more{opacity:1;width:12px} #left button.tb{height:38px} }
  .fbox{position:absolute;z-index:6;display:none;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;min-width:128px;box-shadow:0 4px 14px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
  .fbox.show{display:block}
  .fbox .fh{color:var(--muted);font-size:11px;margin-bottom:3px}
  .fbox .fr{display:flex;justify-content:space-between;gap:14px;line-height:1.55}
  .fbox .fr span{color:var(--muted)}
  /* ═══ 폰 전용 화면 ═══ */
  .monly{display:none!important}
  body.mobile .monly{display:revert!important}
  body.mobile #mnav{display:flex!important}
  body.mobile .donly{display:none!important}
  body.mobile #app{grid-template-rows:46px 1fr 56px;grid-template-columns:1fr}
  body.mobile #top{grid-column:1;gap:2px;padding:0 6px}
  body.mobile #left{display:none}
  body.mobile #center{grid-column:1;grid-row:2}
  body.mobile #right{position:fixed;inset:0;top:calc(46px + env(safe-area-inset-top));bottom:calc(56px + env(safe-area-inset-bottom));width:auto;z-index:40;border:0}
  body.mobile #right .wl-row,body.mobile #right .wl-head{grid-template-columns:1fr 100px 80px 70px 18px;padding:12px 14px;font-size:15px}
  body.mobile #right .wl-head{font-size:12px;padding:6px 14px}
  body.mobile #grid{grid-template:1fr/1fr!important}
  body.mobile #grid .cell:not(.act){display:none}
  body.mobile #grid .cell.act{outline:0}
  body.mobile #symBtn{font-size:15px;padding:5px 10px}
  body.mobile #price{font-size:15px;margin-left:4px;min-width:0}
  body.mobile #drawBar{top:auto;bottom:8px}
  body.mobile #replayBar{bottom:8px}
  body.mobile #toast{bottom:calc(70px + env(safe-area-inset-bottom))}
  body.mobile .menu{max-width:96vw}
  body.mobile #symPanel{position:fixed;inset:0!important;top:calc(46px + env(safe-area-inset-top))!important;width:auto;max-height:none;border-radius:0;z-index:45}
  body.mobile #symList{max-height:calc(100vh - 160px)}
  body.mobile .sym-row,body.mobile .sym-head{grid-template-columns:26px 1fr 90px 64px;padding:10px 12px;font-size:14px}
  body.mobile .sym-row>:last-child,body.mobile .sym-head>:last-child{display:none}
  body.mobile #indBox,body.mobile #setBox{width:100vw;height:100%;border-radius:0;grid-template-columns:110px 1fr}
  body.mobile #indEdit .ln{grid-template-columns:1fr 40px 80px}
  body.mobile #indList .it .m{display:none}
  body.mobile #indList .it{padding:9px 6px}
  #mnav{grid-column:1;grid-row:3;display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom)}
  #mnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);border-radius:0}
  #mnav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  #mnav button.on{color:var(--accent)}
  #mTf{font-weight:700;min-width:44px;border:1px solid var(--line)}
  #mCell{border:1px solid var(--line);font-size:12px}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;max-height:78vh;overflow-y:auto;padding:8px 12px calc(12px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .2s ease;box-shadow:0 -8px 30px rgba(0,0,0,.4)}
  .sheet.show{transform:none}
  .sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 8px}
  .sheet h5{margin:12px 2px 6px;font-size:12px;color:var(--muted);font-weight:600}
  .sheet .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
  .sheet .tgrid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;font-size:11px;border:1px solid var(--line);border-radius:8px;line-height:1.2;text-align:center}
  .sheet .tgrid button.on{border-color:var(--accent);color:var(--accent)}
  .sheet .tgrid svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .sheet .mrow{display:flex;align-items:center;gap:12px;padding:14px 6px;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
  .sheet .mrow:last-child{border-bottom:0}
  #sheetDim{position:fixed;inset:0;z-index:54;background:rgba(0,0,0,.4);display:none}
  #sheetDim.show{display:block}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button id="btnLayout" class="donly" title="레이아웃">▦ 레이아웃</button>
    <div class="sep donly"></div>
    <button id="symBtn" title="종목 검색 (차트에서 아무 글자나 입력해도 열림)">BTCUSDT</button>
    <span id="price">-</span>
    <span id="rpBadge">REPLAY</span>
    <span style="flex:1" class="monly"></span>
    <button id="mCell" class="monly" title="분할 화면 칸 바꾸기"></button>
    <button id="mTf" class="monly"></button>
    <div class="sep donly"></div>
    <div id="tfs" class="donly"></div>
    <div class="sep donly"></div>
    <button id="btnType" title="차트 종류"></button>
    <button id="btnInd" class="donly">ƒ 지표</button>
    <button id="btnReplay" class="donly">⏪ 리플레이</button>
    <button id="btnSettings" class="donly">⚙ 설정</button>
    <button id="btnGrid" class="donly" title="화면 분할">⊞ 분할</button>
    <button id="btnWl" class="donly">☰ 관심</button>
  </div>
  <div id="left"></div>
  <div id="center">
    <div id="grid" data-g="1"></div>
    <div id="drawBar">
      <span id="dbName"></span>
      <span class="vs stl"></span>
      <span id="dbSw" class="stl"></span>
      <input type="color" id="dbColor" class="stl" title="직접 색 고르기">
      <span class="vs stl"></span>
      <select id="dbSize" class="stl" title="두께"><option value="1">1px</option><option value="2">2px</option><option value="3">3px</option><option value="4">4px</option></select>
      <select id="dbLine" class="stl" title="선 모양"><option value="solid">━ 실선</option><option value="dashed">╍ 파선</option><option value="dotted">┈ 점선</option></select>
      <label id="dbFillW" class="stl" title="배경 진하기">▨<input type="range" id="dbFill" min="0" max="0.6" step="0.02"></label>
      <span class="vs"></span>
      <button id="dbClone" title="복제">⧉</button>
      <button id="dbDel" title="삭제 (Delete)">🗑</button>
    </div>
    <div id="hint"><span id="hintText"></span><span id="hintExtra"></span><button id="hintCancel">취소</button></div>
    <div id="replayBar">
      <button id="rpPlay" title="재생/일시정지">▶</button>
      <button id="rpStep" title="한 봉 앞으로 (Shift+→)">⏭</button>
      <select id="rpSpeed" title="속도">
        <option value="0.5">0.5봉/초</option><option value="1" selected>1봉/초</option>
        <option value="2">2봉/초</option><option value="5">5봉/초</option><option value="10">10봉/초</option>
      </select>
      <span id="rpTime"></span>
      <button id="rpPick" title="다른 시작 지점 선택">↺ 시점</button>
      <button id="rpExit" title="리플레이 종료">✕ 종료</button>
    </div>
  </div>
  <div id="right">
    <h3>관심종목 <button id="wlAdd" title="현재 종목 추가">＋ 추가</button></h3>
    <div id="wl"></div>
  </div>
  <nav id="mnav" class="monly"></nav>
</div>
<div class="menu" id="layMenu"></div>
<div class="menu" id="toolFly"></div>
<div class="menu" id="typeMenu"></div>
<div class="menu" id="gridMenu"></div>
<div class="menu" id="symPanel">
  <div class="hd">
    <input id="symSearch" type="text" placeholder="종목 검색 (예: btc, 비트코인)" spellcheck="false" autocomplete="off">
    <span class="tabs"><button data-mk="futures">선물</button><button data-mk="spot">현물</button><button data-mk="upbit">업비트</button></span>
  </div>
  <div class="sym-head"><span></span><span>종목</span><span class="r">가격</span><span class="r">24h</span><span class="r">거래대금</span></div>
  <div id="symList"></div>
</div>
<div id="indModal" class="modal">
  <div id="indBox">
    <div class="hd"><span>지표 설정</span><button id="indClose">✕</button></div>
    <div id="indList"></div>
    <div id="indEdit"></div>
  </div>
</div>
<div id="setModal" class="modal">
  <div id="setBox">
    <div class="hd"><span>차트 설정</span><button id="setClose">✕</button></div>
    <div id="setTabs"></div>
    <div id="setBody"></div>
    <div class="ft"><button id="setReset">기본값으로</button><span class="m">바꾸는 즉시 적용·저장돼요</span></div>
  </div>
</div>
<div id="sheetDim"></div>
<div class="sheet" id="toolSheet"></div>
<div class="sheet" id="moreSheet"></div>
<div class="menu" id="tfMenu"></div>
<div id="toast"></div>

<script src="klinecharts.min.js"></script>
<script src="tools.js"></script>
<script src="app.js"></script>
</body>
</html>
